/* RAZORPAY ENGLISH PDF PAYMENT */

const PAYMENT_BACKEND =
    "https://razopay-api.vercel.app/";

async function openEnglishPDF() {

    try {

        // Create ₹15 Razorpay order
        const orderResponse =
            await fetch(
                PAYMENT_BACKEND +
                "/api/create-order",
                {
                    method: "POST"
                }
            );


        if (!orderResponse.ok) {
            throw new Error("Order API returned HTTP " + orderResponse.status);
        }

        const orderData =
            await orderResponse.json();


        if (!orderData.success) {

            alert(
                "Payment order তৈরি করা যায়নি। আবার চেষ্টা করুন।"
            );

            return;
        }


        const options = {

            key: orderData.keyId,

            amount: orderData.amount,

            currency: orderData.currency,

            name: "BAPI SARKAR",

            description:
                "SSC CHSL Parts of Speech PDF",

            order_id:
                orderData.orderId,


            handler:
                async function (response) {

                    try {

                        const verifyResponse =
                            await fetch(

                                PAYMENT_BACKEND +
                                "/api/verify-payment",

                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            response
                                        )

                                }

                            );


                        if (!verifyResponse.ok) {
                            throw new Error("Verification API returned HTTP " + verifyResponse.status);
                        }

                        const result =
                            await verifyResponse.json();


                        if (
                            result.verified === true
                        ) {

                            alert(
                                "✅ Payment successful!\nPDF opening..."
                            );


                            window.open(
                                "PART_OF_SPEECH.pdf",
                                "_blank"
                            );


                        } else {

                            alert(
                                "❌ Payment verification failed."
                            );

                        }

                    } catch (error) {

                        console.error(error);

                        alert(
                            "Payment verification করতে সমস্যা হয়েছে।"
                        );

                    }

                },


            prefill: {
                name: "BAPI SARKAR"
            },


            notes: {
                product:
                    "SSC CHSL Parts of Speech PDF"
            },


            theme: {
                color: "#ff0000"
            }

        };


        const razorpay =
            new Razorpay(options);


        razorpay.on(
            "payment.failed",
            function (response) {

                console.error(
                    response.error
                );

                alert(
                    "❌ Payment failed.\nআবার চেষ্টা করুন।"
                );

            }
        );


        razorpay.open();


    } catch (error) {

        console.error(error);

        alert(
            "Payment system চালু করা যায়নি।"
        );

    }

}
